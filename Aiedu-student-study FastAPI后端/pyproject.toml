[project]
name = "aiedu-fastapi"
version = "0.1.0"
description = "AIedu FastAPI migration backend"
requires-python = "==3.11.*"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]==0.35.0",
  "sqlalchemy==2.0.54",
  "alembic==1.20.0",
  "pymysql[rsa]==1.1.1",
  "pydantic-settings==2.10.1",
  "pyjwt==2.10.1",
  "argon2-cffi==23.1.0",
  "redis==8.1.0",
  "python-multipart==0.0.20",
  "rocketmq-python-client==5.1.2",
  "langchain==1.4.1",
  "langgraph==1.2.11",
  "langchain-openai==1.0.1",
  "minio==7.2.16",
  "qdrant-client==1.15.1",
  "httpx==0.28.1",
  "pypdf==6.0.0",
  "python-docx==1.2.0",
  "python-pptx==1.0.2",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.2",
  "pytest-cov==7.0.0",
]
reranker = [
  "sentence-transformers>=3.4,<4",
]

[project.scripts]
aiedu-api = "app.main:run"
aiedu-worker = "app.worker:run"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
