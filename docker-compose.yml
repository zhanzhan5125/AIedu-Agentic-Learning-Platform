name: aiedu
services:
  mysql:
    image: mysql:8.0.36
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-aiedu_v2}
      MYSQL_USER: ${MYSQL_USER:-aiedu}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      TZ: Asia/Shanghai
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    volumes: ["mysql-data:/var/lib/mysql"]
    ports: ["3307:3306"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4.11-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}"]
    volumes: ["redis-data:/data"]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.19.1
    volumes:
      - qdrant-data:/qdrant/storage
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-aiedu}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-aiedu-development}
    volumes:
      - minio-data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 20

  namesrv:
    image: apache/rocketmq:5.3.2
    command: sh mqnamesrv
    ports: ["9876:9876"]
    healthcheck:
      test: ["CMD-SHELL", "sh mqadmin clusterList -n localhost:9876 >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 20

  rocketmq:
    image: apache/rocketmq:5.3.2
    # The official image runs as an unprivileged user, while a newly-created
    # named volume is owned by root. Bootstrap it as root so broker state can
    # be persisted on a clean Docker installation.
    user: root
    command: sh mqbroker -n namesrv:9876 -c /home/rocketmq/rocketmq-5.3.2/conf/broker.conf --enable-proxy -pc /home/rocketmq/rocketmq-5.3.2/conf/proxy.json
    depends_on:
      namesrv: {condition: service_healthy}
    volumes:
      - ./deploy/rocketmq/broker.conf:/home/rocketmq/rocketmq-5.3.2/conf/broker.conf:ro
      - ./deploy/rocketmq/proxy.json:/home/rocketmq/rocketmq-5.3.2/conf/proxy.json:ro
      - rocketmq-store:/home/rocketmq/store
    ports: ["8081:8081", "10911:10911"]
    healthcheck:
      test: ["CMD-SHELL", "sh mqadmin clusterList -n namesrv:9876 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20

  rocketmq-init:
    image: apache/rocketmq:5.3.2
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        sh mqadmin updateTopic -b rocketmq:10911 -t $${AIEDU_ROCKETMQ_TOPIC:-aiedu-ai-jobs}
        && sh mqadmin updateSubGroup -b rocketmq:10911 -g aiedu-ai-worker
    environment:
      AIEDU_ROCKETMQ_TOPIC: ${AIEDU_ROCKETMQ_TOPIC:-aiedu-ai-jobs}
    depends_on:
      rocketmq: {condition: service_healthy}

  migrate:
    profiles: ["container-app"]
    build: ./Aiedu-student-study FastAPI后端
    command: alembic upgrade head
    env_file: .env
    depends_on:
      mysql: {condition: service_healthy}

  api:
    profiles: ["container-app"]
    build: ./Aiedu-student-study FastAPI后端
    env_file:
      - .env
      - .env.ai
    environment:
      AIEDU_OBJECT_STORAGE_BACKEND: minio
      AIEDU_MINIO_ENDPOINT: minio:9000
      AIEDU_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-aiedu}
      AIEDU_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-aiedu-development}
    ports: ["9091:9091"]
    volumes: ["uploads:/app/uploads"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      rocketmq: {condition: service_healthy}
      minio: {condition: service_healthy}
      qdrant: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9091/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 20

  worker:
    profiles: ["container-app"]
    build: ./Aiedu-student-study FastAPI后端
    command: python -m app.worker
    env_file:
      - .env
      - .env.ai
    environment:
      AIEDU_OBJECT_STORAGE_BACKEND: minio
      AIEDU_MINIO_ENDPOINT: minio:9000
      AIEDU_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-aiedu}
      AIEDU_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-aiedu-development}
    volumes: ["uploads:/app/uploads"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      rocketmq-init: {condition: service_completed_successfully}
      minio: {condition: service_healthy}
      qdrant: {condition: service_healthy}

  frontend:
    profiles: ["container-app"]
    build:
      context: ./Aiedu-student-study 前端
    ports: ["8080:80"]
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  mysql-data:
  redis-data:
  qdrant-data:
  minio-data:
  rocketmq-store:
  uploads:
